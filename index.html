<style>
:root{--bg:#F2F6F8;--card:#FFFFFF;--ink:#0F2A3D;--mute:#4D6475;--sea:#0E7C86;--sun:#F2A93B;--line:#D3DEE5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A24;--card:#122836;--ink:#E8F1F5;--mute:#9DB4C2;--sea:#4FC3CC;--sun:#F2B24F;--line:#24404F}}
:root[data-theme="dark"]{--bg:#0B1A24;--card:#122836;--ink:#E8F1F5;--mute:#9DB4C2;--sea:#4FC3CC;--sun:#F2B24F;--line:#24404F}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
a{color:var(--sea)}
a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
nav{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;padding:18px 0;font-size:15px}
nav a{color:var(--mute);text-decoration:none}nav a:hover{color:var(--ink)}
.hero{padding:56px 0 64px}
.hero h1{font-weight:800;font-size:clamp(46px,10vw,92px);letter-spacing:-.03em}
.hero-in{display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center}
.photo{width:210px;height:210px;border-radius:50%;object-fit:cover;border:4px solid var(--sun);background:var(--card);display:block}
.initials{display:flex;align-items:center;justify-content:center;font:800 64px "Bricolage Grotesque",sans-serif;color:var(--sea)}
@media (max-width:720px){.hero-in{grid-template-columns:1fr}.photo{order:-1;width:150px;height:150px}.initials{font-size:46px}}
.hero p.role{font-size:clamp(19px,3vw,24px);color:var(--mute);max-width:34ch;margin:18px 0 26px}
.wave{display:block;width:100%;max-width:520px;height:22px;margin-top:6px}
.wave path{stroke:var(--sun);stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.6s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.wave path{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;font-weight:500;text-decoration:none;background:var(--ink);color:var(--bg)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
section{padding:56px 0;border-top:1px solid var(--line)}
section>.wrap>h2{font-size:clamp(28px,5vw,40px);margin-bottom:26px}
.about{max-width:62ch}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{font-size:21px;margin-bottom:8px}
.card p{margin:0 0 12px;color:var(--mute);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.tags li{font-size:14px;padding:3px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.skills .card h3{font-size:18px}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--sea)}
.tl li{position:relative;padding:0 0 30px 6px}
.tl li::before{content:"";position:absolute;left:-30px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--sun);border:2px solid var(--bg)}
.tl h3{font-size:21px}.tl .when{color:var(--mute);font-size:15px;margin:2px 0 8px}.tl p{margin:0;max-width:62ch}
.contact p{max-width:52ch;color:var(--mute)}
footer{padding:28px 0 40px;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
</style>

const $ = id => document.getElementById(id);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.textContent = h; return e; };
const tags = list => { const u = el("ul","tags"); list.forEach(t => u.append(el("li","",t))); return u; };

$("name").textContent = ME.name;
$("role").textContent = ME.role;
if (ME.resumeLink) { const r = $("resume"); r.href = ME.resumeLink; r.target = "_blank"; r.rel = "noopener noreferrer"; r.textContent = "View resume"; }
const ph = $("photo"); ph.src = ME.photo;
ph.onerror = () => { const d = el("div","photo initials", ME.name.split(" ").map(w => w[0]).join("").slice(0,2)); d.setAttribute("role","img"); d.setAttribute("aria-label","Initials of " + ME.name); ph.replaceWith(d); };
ME.about.forEach(p => $("about-text").append(el("p","",p)));

Object.entries(ME.skills).forEach(([k,v]) => { const c = el("div","card"); c.append(el("h3","",k), tags(v)); $("skills-grid").append(c); });

ME.experience.forEach(x => { const li = el("li"); li.append(el("h3","",x.title), el("p","when",x.when), el("p","",x.text)); $("exp").append(li); });

ME.projects.forEach(p => {
  const c = el("div","card"); c.append(el("h3","",p.title), el("p","",p.text), tags(p.tags));
  if (p.link) { const a = el("a","", p.tags.includes("Live") ? "Open live site" : "View project"); a.href = p.link; a.target = "_blank"; a.rel = "noopener noreferrer"; a.style.display = "inline-block"; a.style.marginTop = "12px"; c.append(a); }
  $("proj").append(c);
});

ME.education.forEach(e => { const c = el("div","card"); c.append(el("h3","",e.title), el("p","",e.place + " | " + e.when)); if (e.note) c.append(tags([e.note])); $("edu").append(c); });

ME.achievements.forEach(a => { const c = el("div","card"); c.append(el("h3","",a.title), el("p","",a.text)); $("ach").append(c); });

$("contact-text").textContent = ME.contact;
const mail = el("a","btn","Email me"); mail.href = "mailto:" + ME.email; mail.target = "_blank"; mail.rel = "noopener noreferrer"; $("links").append(mail);
ME.links.forEach(l => { const a = el("a","btn alt",l.label); a.href = l.href; a.target = "_blank"; a.rel = "noopener noreferrer"; $("links").append(a); });
const addr = el("p","", ME.email + " "); addr.style.marginTop = "18px";
const cp = el("button","btn alt","Copy email"); cp.type = "button"; cp.style.cssText = "font:inherit;cursor:pointer;padding:6px 16px;margin-left:6px";
cp.onclick = () => { const done = () => { cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy email", 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(ME.email).then(done, () => cp.textContent = "Select and copy above");
  else cp.textContent = "Select and copy above"; };
addr.append(cp); $("contact-text").after(addr);

$("foot").textContent = "© " + new Date().getFullYear() + " " + ME.name;
document.title = ME.name + " | Portfolio";
</script>
</body>
</html>
